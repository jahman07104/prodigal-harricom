      <stop offset="0%" stop-color="#103b5a" />
      <stop offset="55%" stop-color="#0b2437" />
      <stop offset="100%" stop-color="#08141f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#f0a202" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f0a202" stop-opacity="0" />
