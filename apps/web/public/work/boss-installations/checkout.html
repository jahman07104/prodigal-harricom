<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Boss Installations</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar" id="navbar">
      <div class="nav-container">
        <a href="index.html" class="nav-logo">BOSS</a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="checkout.html">Checkout</a></li>
          <li><a href="admin/index.html" class="nav-admin-link">Admin</a></li>
        </ul>
      </div>
    </nav>

    <main class="container shop-page">
      <section class="section">
        <div class="section-header">
          <h1>Checkout</h1>
          <p>
            Complete your order and submit a request. We will follow up to
            confirm payment and shipping.
          </p>
        </div>

        <div class="checkout-layout">
          <div class="checkout-form-card">
            <h2>Customer Information</h2>
            <form id="checkoutForm">
              <div class="form-row">
                <label for="customerName">Name</label>
                <input type="text" id="customerName" required />
              </div>
              <div class="form-row">
                <label for="customerEmail">Email</label>
                <input type="email" id="customerEmail" required />
              </div>
              <div class="form-row">
                <label for="customerPhone">Phone</label>
                <input type="tel" id="customerPhone" />
              </div>
              <div class="form-row">
                <label for="customerAddress">Address</label>
                <textarea id="customerAddress" rows="3"></textarea>
              </div>
              <div class="form-row">
                <button type="submit" class="btn btn-primary btn-full">
                  Submit Order
                </button>
                <div style="display:flex;gap:12px;">
                  <button type="submit" class="btn btn-outline" id="payLaterBtn">Submit Order (Pay Later)</button>
                  <button type="button" class="btn btn-primary" id="payNowBtn">Pay Now (Card)</button>
                </div>
              <div id="checkoutStatus" class="form-status"></div>
            </form>
          </div>

          <div class="checkout-summary-card">
            <h2>Order Summary</h2>
            <div id="cartItems"></div>
            <div class="order-total">
              <span>Total</span>
              <span id="cartTotal">$0.00</span>
            </div>
            <button id="clearCart" class="btn btn-outline btn-full">
              Clear Cart
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/checkout.js"></script>
  </body>
</html>
