<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-label="Jamaican doctor bird logo">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EF38A"/>
      <stop offset="55%" stop-color="#11A65C"/>
      <stop offset="100%" stop-color="#0A6B3F"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2329"/>
      <stop offset="100%" stop-color="#0B0E12"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE6F2"/>
    </linearGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2820"/>
      <stop offset="50%" stop-color="#0A6B3F"/>
      <stop offset="100%" stop-color="#0B0E12"/>
    </linearGradient>
  </defs>

  <!-- STREAMERTAIL FEATHER 1 (upper) — sweeps left-down then curves back up, ends in a circle curl -->
  <path d="M 120,148 C 68,182, 10,240, 30,282 C 42,308, 84,310, 88,278 C 90,260, 76,244, 62,252"
        fill="none" stroke="url(#ts)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 120,148 C 68,182, 10,240, 30,282 C 42,308, 84,310, 88,278 C 90,260, 76,244, 62,252"
        fill="none" stroke="#2ECC71" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="57" cy="261" r="9" fill="none" stroke="url(#ts)" stroke-width="6"/>
  <circle cx="57" cy="261" r="9" fill="none" stroke="#2ECC71" stroke-width="2" opacity="0.55"/>

  <!-- STREAMERTAIL FEATHER 2 (lower) — same sweep, slightly offset -->
  <path d="M 138,160 C 86,196, 36,254, 54,294 C 66,318, 106,316, 108,286 C 110,270, 96,256, 82,263"
        fill="none" stroke="url(#ts)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 138,160 C 86,196, 36,254, 54,294 C 66,318, 106,316, 108,286 C 110,270, 96,256, 82,263"
        fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="77" cy="271" r="7" fill="none" stroke="url(#ts)" stroke-width="5"/>
  <circle cx="77" cy="271" r="7" fill="none" stroke="#2ECC71" stroke-width="1.5" opacity="0.5"/>

  <!-- BODY -->
  <ellipse cx="196" cy="128" rx="64" ry="36" fill="url(#bd)" transform="rotate(-8 196 128)"/>

  <!-- WING -->
  <path d="M160 99 C179 70, 239 62, 274 86 C258 120, 210 132, 166 122 Z" fill="url(#wg)"/>
  <path d="M175 111 C202 87, 242 86, 268 102" fill="none" stroke="#8AF6B0" stroke-width="4" stroke-linecap="round"/>

  <!-- BELLY -->
  <ellipse cx="188" cy="143" rx="34" ry="20" fill="url(#bl)" transform="rotate(-10 188 143)"/>

  <!-- HEAD -->
  <ellipse cx="247" cy="116" rx="18" ry="16" fill="url(#bd)"/>
  <path d="M237 103 C246 90, 266 87, 276 97 C269 108, 251 111, 239 108 Z" fill="url(#wg)"/>
  <circle cx="253" cy="114" r="2.8" fill="#FFFFFF"/>

  <!-- BILL -->
  <path d="M263 116 L345 103 L264 121 Z" fill="#D63E2A"/>

  <!-- CREST -->
  <path d="M140 120 C111 83, 117 54, 155 43 C166 68, 165 95, 140 120 Z" fill="url(#wg)"/>
  <path d="M139 121 C94 95, 75 74, 74 42 C113 46, 136 72, 147 112 Z" fill="url(#wg)"/>

  <!-- BELLY SHINE -->
  <path d="M178 162 C202 170, 221 170, 242 159" fill="none" stroke="#8AF6B0" stroke-width="5" stroke-linecap="round"/>
</svg>
