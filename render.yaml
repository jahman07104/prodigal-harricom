services:
  - type: web
    name: harricom-payments-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://harricom.netlify.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CHECKOUT_ALLOWED_ORIGINS
        value: https://harricom.netlify.app
      - key: STRIPE_PRODUCT_CATALOG_JSON
        sync: false
