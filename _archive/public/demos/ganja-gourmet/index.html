<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganja Gourmet | Premium Cannabis × Gourmet Experience</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { background: #181b22; color: #f8f8f8; font-family: system-ui, sans-serif; margin: 0; }
    .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 1rem 1.5rem 1rem; text-align: center; }
    .hero-content { z-index: 2; }
    .sub-logo { width: 90px; margin-bottom: 1.2rem; border-radius: 12px; box-shadow: 0 2px 12px #000a; background: #fff; }
    .hero h1 { font-size: 2.2rem; font-weight: 800; margin: 0.5em 0 0.3em 0; letter-spacing: -1px; color: #7ed957; }
    .hero p { font-size: 1.15rem; color: #e0e0e0; margin-bottom: 1.5em; }
    .cta-btn { display: inline-block; background: linear-gradient(90deg, #7ed957 60%, #ff7a1a 100%); color: #181b22; font-weight: bold; padding: 0.85em 2.2em; border-radius: 2em; font-size: 1.1em; text-decoration: none; box-shadow: 0 2px 8px #0005; transition: background 0.2s; }
    .cta-btn:hover { background: linear-gradient(90deg, #ff7a1a 60%, #7ed957 100%); color: #fff; }
    .hero-img { width: 100%; max-width: 420px; margin: 2.5em auto 0 auto; border-radius: 18px; box-shadow: 0 4px 32px #000a; display: block; }
    @media (min-width: 700px) { .hero { min-height: 80vh; } .hero h1 { font-size: 2.8rem; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <img src="logo.png" class="sub-logo" alt="Ganja Gourmet Logo">
      <h1>Premium Cannabis × Gourmet Experience</h1>
      <p>Where Jamaican culinary artistry meets modern cannabis culture.</p>
      <a href="https://wa.me/18764824321" class="cta-btn">Order Now via WhatsApp</a>
    </div>
    <img src="../../assets/images/optimized/ganjagourmet-demo.png" class="hero-img" alt="Ganja Gourmet Hero">
    <img src="/demos/ganja-gourmet/thumbnail.png" alt="Ganja Gourmet Thumbnail" class="demo-thumb">
  </section>
</body>
</html>
